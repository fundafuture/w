<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, textarea, button { padding: 10px; font-size: 16px; }
    button { background-color: #2563eb; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Submit Information</h2>
  
  <form id="submissionForm">
    <input type="text" id="name" placeholder="Your Name" required />
    <input type="email" id="email" placeholder="Your Email" required />
    <textarea id="message" placeholder="Your Message" rows="4" required></textarea>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9E44fFpAs4wYCO4BbAWZqkDfyv1es9rwlMTP81fmqtwod1MY74Sjh_vVZFAlm9pmcDg/exec';

    document.getElementById('submissionForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const status = document.getElementById('status');
      status.textContent = 'Submitting...';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Avoid CORS restriction issues
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        status.textContent = 'Submitted successfully!';
        document.getElementById('submissionForm').reset();
      })
      .catch(error => {
        status.textContent = 'Error submitting form.';
        console.error('Error:', error);
      });
    });
  </script>

</body>
</html>
